<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>sshare</title>
<style>
  :root { --bg: #16161e; --fg: #c0caf5; --dim: #565f89; --acc: #7aa2f7; --ok: #9ece6a; --bad: #f7768e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, 'JetBrains Mono', monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #term { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #badge { position: fixed; top: 10px; right: 12px; padding: 4px 10px; border-radius: 999px; background: #1f2335ee; border: 1px solid #292e42; font-size: 12px; z-index: 5; user-select: none; }
  #badge .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; vertical-align: 1px; }
  #badge.live .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  #badge.off .dot { background: var(--bad); }
  #overlay { position: fixed; inset: 0; display: none; place-items: center; background: #16161ecc; z-index: 10; font-size: 15px; text-align: center; padding: 24px; }
  #overlay.show { display: grid; }
  #ask { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(720px, calc(100vw - 24px)); display: none; z-index: 6;
         background: #1f2335f2; border: 1px solid #3b4261; border-radius: 12px; padding: 10px 12px; box-shadow: 0 10px 40px #0009; backdrop-filter: blur(6px); }
  #ask.show { display: block; }
  #ask.min textarea, #ask.min .row { display: none; }
  #ask textarea { width: 100%; min-height: 44px; max-height: 40vh; resize: vertical; background: transparent; color: var(--fg); border: 0; outline: 0; font: inherit; }
  #ask .row { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 11px; margin-top: 4px; }
  #ask .head { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-bottom: 4px; cursor: pointer; user-select: none; }
  #ask button { background: var(--acc); color: #16161e; border: 0; border-radius: 6px; padding: 4px 12px; font: inherit; font-weight: 600; cursor: pointer; }
  #ask button:disabled { opacity: .5; cursor: default; }
  #msg.ok { color: var(--ok); } #msg.bad { color: var(--bad); }
</style>
</head>
<body>
<div id="stage"><div id="term"></div></div>
<div id="badge"><span class="dot"></span><span id="badge-text">connecting…</span></div>
<div id="overlay"><div id="overlay-text"></div></div>
<div id="ask">
  <div class="head" id="ask-head"><span>send a message to the session</span><span id="ask-toggle">hide</span></div>
  <textarea id="ask-text" placeholder="type a prompt… (enter sends, shift+enter newline)" maxlength="8000"></textarea>
  <div class="row"><span id="msg">queued if the agent is busy</span><button id="ask-send">send</button></div>
</div>
<script type="module">
import { init, Terminal } from '/vendor/ghostty-web.js'

const $ = id => document.getElementById(id)
const sid = location.pathname.split('/')[2]
const token = new URLSearchParams(location.hash.slice(1)).get('t')
// keep the token out of the address bar once read; reloads keep it in sessionStorage
if (token) { sessionStorage.setItem('sshare:' + sid, token); history.replaceState(null, '', location.pathname) }
const tok = token || sessionStorage.getItem('sshare:' + sid)

const overlay = text => { $('overlay-text').textContent = text; $('overlay').classList.toggle('show', !!text) }
const badge = (text, cls) => { $('badge-text').textContent = text; $('badge').className = cls || '' }

if (!tok) { overlay('this link has no token.'); throw new Error('no token') }

await init()
let term, cols = 0, rows = 0, mode = 'read', closed = false

function ensureTerm(w, h) {
  if (term && w === cols && h === rows) return
  cols = w; rows = h
  if (!term) {
    term = new Terminal({ cols, rows, fontSize: 14, disableStdin: true, cursorBlink: false,
      fontFamily: "'JetBrains Mono', ui-monospace, monospace", theme: { background: '#16161e', foreground: '#c0caf5' } })
    term.open($('term'))
  } else term.resize(cols, rows)
  requestAnimationFrame(fit)
}
function fit() {
  const el = $('term'); el.style.transform = 'none'
  const r = el.getBoundingClientRect()
  if (!r.width || !r.height) return
  const ask = $('ask')
  const reserve = ask.classList.contains('show') ? ask.getBoundingClientRect().height + 28 : 0
  const avail = innerHeight - reserve
  const s = Math.min(innerWidth / r.width, avail / r.height)
  el.style.left = Math.max(0, (innerWidth - r.width * s) / 2) + 'px'
  el.style.top = Math.max(0, (avail - r.height * s) / 2) + 'px'
  el.style.transform = `scale(${s})`
}
addEventListener('resize', fit)

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
let ws
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/view?sid=${sid}`)
  ws.onopen = () => ws.send(JSON.stringify({ type: 'auth', token: tok }))
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data)
    if (m.type === 'frame') { ensureTerm(m.width, m.height); term.write(b64(m.bytes)) }
    else if (m.type === 'hello') {
      mode = m.mode
      badge(m.online ? `live · ${mode === 'edit' ? 'can send' : 'watching'}` : 'host offline', m.online ? 'live' : 'off')
      $('ask').classList.toggle('show', mode === 'edit')
      requestAnimationFrame(fit)
      if (!m.online) overlay('waiting for the host…')
    }
    else if (m.type === 'host') {
      badge(m.online ? `live · ${mode === 'edit' ? 'can send' : 'watching'}` : 'host offline', m.online ? 'live' : 'off')
      overlay(m.online ? '' : 'the host is offline. waiting…')
    }
    else if (m.type === 'queued') {
      $('msg').textContent = m.pending ? 'waiting for the host to approve…' : m.ok ? 'sent ✓ (queued if busy)' : `not sent: ${m.why}`
      $('msg').className = m.pending ? '' : m.ok ? 'ok' : 'bad'
      $('ask-send').disabled = false
      if (m.ok || m.pending) $('ask-text').value = ''
    }
    else if (m.type === 'closed') { closed = true; overlay(m.reason); badge('ended', 'off'); $('ask').classList.remove('show') }
  }
  ws.onclose = () => { if (!closed) { badge('reconnecting…', 'off'); setTimeout(connect, 1500) } }
}
connect()

function sendPrompt() {
  const text = $('ask-text').value.trim()
  if (!text || ws.readyState !== 1) return
  $('ask-send').disabled = true
  $('msg').textContent = 'sending…'; $('msg').className = ''
  ws.send(JSON.stringify({ type: 'prompt', text }))
}
$('ask-send').onclick = sendPrompt
$('ask-text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendPrompt() } })
$('ask-head').onclick = () => { const min = $('ask').classList.toggle('min'); $('ask-toggle').textContent = min ? 'show' : 'hide'; fit() }
new ResizeObserver(() => fit()).observe($('ask'))
</script>
</body>
</html>
